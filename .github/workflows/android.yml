name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle an offline copy of the game into the APK
        run: |
          python3 game/build.py --out dist
          mkdir -p android/app/src/main/assets/www
          cp dist/index.html android/app/src/main/assets/www/index.html
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_B64 secret: signing with the committed key in android/signing."
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "late-stage-build-${BUILD_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: late-stage-build-${{ github.run_number }}
          path: late-stage-build-*.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Late Stage app, build ${{ github.run_number }}
          body: |
            Android app shell for Late Stage. It plays the live game from https://elschmoko.github.io/late-stage/ (updated on every push to `game/`), and falls back to the bundled copy when offline.
            Install: download the APK below on your phone and open it (allow installs from your browser).
          files: late-stage-build-*.apk
          make_latest: true
